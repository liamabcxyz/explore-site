[package]
name = "vantage-core"
version = "0.1.0"
edition = "2021"
description = "VANTAGE viewshed compute kernels, exported to WebAssembly for the browser worker to call."

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"

# Release profile: aggressive size + perf. wasm-opt gets a final pass via
# wasm-pack's built-in step. `opt-level = 3` favors runtime speed (this is a
# compute kernel, not glue); `lto = true` cross-module optimization.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
